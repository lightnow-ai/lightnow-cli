name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Import sort check
        run: make isort-check

      - name: Type check
        run: make type-check

      - name: Test
        run: make test

      - name: CLI smoke
        run: make integration

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install -e ".[dev]"

      - name: Build and check distributions
        run: make package

      - name: Verify distribution provenance contract
        run: python -m unittest discover -s ci -p 'test_*.py'

      - name: Bind PR distribution provenance
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python ci/create_client_artifact.py --component cli \
            --repository "$ARTIFACT_REPOSITORY" \
            --pr-number "$ARTIFACT_PR_NUMBER" \
            --head-revision "$ARTIFACT_HEAD_REVISION" \
            --run-id "$ARTIFACT_RUN_ID" \
            --run-attempt "$ARTIFACT_RUN_ATTEMPT"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
